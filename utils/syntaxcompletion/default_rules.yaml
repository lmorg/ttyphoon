languages:
  go:
    context_guard:
      enabled: true
      disallow_in: ["comment", "string"]
    pairs:
      - open: "("
        close: ")"
      - open: "["
        close: "]"
      - open: "{"
        close: "}"
      - open: "\""
        close: "\""
        skip_close: true
      - open: "'"
        close: "'"
        skip_close: true
  json:
    context_guard:
      enabled: true
      disallow_in: ["comment", "string"]
    pairs:
      - open: "{"
        close: "}"
      - open: "["
        close: "]"
      - open: "\""
        close: "\""
        skip_close: true
  markdown:
    pairs:
      - open: "("
        close: ")"
      - open: "["
        close: "]"
      - open: "{"
        close: "}"
    list_continuation:
      enabled: true
      unordered_markers: ["- [ ]", "-", "*", "+"]
      ordered: true
      exit_on_empty_item: true
  html:
    context_guard:
      enabled: true
      disallow_in: ["comment", "string"]
    pairs:
      - open: "\""
        close: "\""
        skip_close: true
      - open: "'"
        close: "'"
        skip_close: true
    auto_close_tags:
      enabled: true
      allowed: ["p", "div", "span", "li", "ul", "ol", "strong", "em", "section", "article", "header", "footer"]
