version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Build for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1

  package:
    summary: Build the Linux executable
    deps:
      - task: build

  run:
    summary: Run the Linux application
    deps:
      - task: build
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"