# This file contains the configuration for this project.
# `make build` increments info.version before updating generated build assets.
# After changing other info fields, run `wails task common:update:build-assets`.
version: '3'

info:
  companyName: "Laurence Morgan"
  productName: "Ttyphoon"
  productIdentifier: "com.lmorg.ttyphoon"
  description: "The Next Generation Terminal Emulator"
  copyright: "2023-2026 Laurence Morgan"
  license: "GPL-2.0-or-later"
  comments: "The Next Generation Terminal Emulator"
  version: "1.3.2300"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails task common:update:build-assets
      type: blocking
    - cmd: wails build DEV=true
      type: blocking
    - cmd: wails task common:dev:frontend
      type: background
    - cmd: wails task run
      type: primary
      exit_policy: shutdown
