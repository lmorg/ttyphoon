version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Build for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:update:build-assets
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - |
        app_ldflags=$(GOOS= GOARCH= go run ./build/buildflags)
        go build {{.BUILD_FLAGS}} -ldflags="{{.LINKER_FLAGS}} $app_ldflags" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false{{end}}'
      LINKER_FLAGS: '{{if ne .DEV "true"}}-w -s -H windowsgui{{end}}'
    env:
      GOOS: windows
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: '{{.CGO_ENABLED | default "1"}}'

  package:
    summary: Build the Windows executable
    deps:
      - task: build

  run:
    summary: Run the Windows application
    deps:
      - task: build
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}.exe"