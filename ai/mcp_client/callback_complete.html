<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Authentication complete</title>
	<style>
		:root {
			--bg: rgb({{.Bg.Red}}, {{.Bg.Green}}, {{.Bg.Blue}});
			--fg: rgb({{.Fg.Red}}, {{.Fg.Green}}, {{.Fg.Blue}});
			--accent: rgb({{.Accent.Red}}, {{.Accent.Green}}, {{.Accent.Blue}});
		}

		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--bg);
			color: var(--fg);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			line-height: 1.4;
			text-align: center;
		}

		.wrap {
			padding: 24px;
			max-width: 640px;
		}

		h1 {
			margin: 0 0 12px;
			color: var(--accent);
			font-size: clamp(1.3rem, 2.4vw, 1.8rem);
			font-weight: 600;
		}

		p {
			margin: 0;
			font-size: clamp(1rem, 1.8vw, 1.1rem);
		}
	</style>
</head>
<body>
	<main class="wrap">
		<h1>Authentication complete</h1>
		<p>You can close this window and return to {{.AppName}}.</p>
	</main>
	<script>
		window.close();
	</script>
</body>
</html>
